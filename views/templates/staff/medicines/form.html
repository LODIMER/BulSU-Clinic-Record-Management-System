{% extends "base.html" %}
{% block title %}{{ 'Edit' if medicine else 'Add' }} Medicine - BulSU Clinic{% endblock %}

{% block content %}
<div class="page-header">
    <h1>{{ 'Edit' if medicine else 'Add' }} Medicine</h1>
</div>

<div class="card">
    <form method="POST">
        <div class="form-grid">
            <div class="form-group">
                <label for="name">Medicine Name *</label>
                <input type="text" id="name" name="name" value="{{ medicine.name if medicine else '' }}" required>
            </div>
            <div class="form-group">
                <label for="category">Category</label>
                <input type="text" id="category" name="category" value="{{ medicine.category if medicine else '' }}">
            </div>
            <div class="form-group">
                <label for="quantity">Quantity</label>
                <input type="number" id="quantity" name="quantity" min="0" value="{{ medicine.quantity if medicine else 0 }}">
            </div>
            <div class="form-group">
                <label for="expiration_date">Expiration Date</label>
                <input type="date" id="expiration_date" name="expiration_date" value="{{ medicine.expiration_date if medicine else '' }}">
            </div>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">{{ 'Update' if medicine else 'Add' }} Medicine</button>
            <a href="{{ url_for('medicines.list_medicines') }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
